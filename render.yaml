services:
  - type: web
    name: whatsapp-api-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WHATSAPP_AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: LOG_LEVEL
        value: info
    disk:
      name: whatsapp-auth
      mountPath: /var/data
      sizeGB: 1
